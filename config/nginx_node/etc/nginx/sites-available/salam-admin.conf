server {
    listen 80;

    # Menangkap semua subdomain + root domain
    server_name  admin.salam.local.id admin-salam.andikcloud.my.id;
    # Arahkan root ke direktori build admin
    root /projects/salam/web/dist-admin;
    index index.html;

    # 1. Proxy semua request /api/ ke NestJS backend (Port 3007)
    location /api/ {
        proxy_pass http://172.16.0.8:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. SPA Fallback untuk Vite PWA Admin
    location / {
        try_files $uri $uri/ /index.html;
    }
}
